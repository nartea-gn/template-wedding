<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Código de acceso a Nartea</title>
</head>
<body style="margin:0;background:#f8f9fb;color:#0f2347;font-family:Arial,sans-serif;">
<table cellpadding="0" cellspacing="0" role="presentation" style="background:#f8f9fb;padding:32px 16px;" width="100%">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;background:#ffffff;border:1px solid #d9c483;border-radius:12px;padding:40px 28px;"
                   width="100%">
                <tr>
                    <td align="center">
                        <p style="margin:0 0 12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#6b7280;">
                            Nartea
                        </p>
                        <h1 style="margin:0 0 18px;font-family:Georgia,serif;font-size:28px;font-weight:400;color:#1b3a6b;">
                            Tu código de acceso
                        </h1>
                        <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:#44516a;">
                            Introduce este código en la pantalla de administración de tu invitación.
                        </p>
                        <p style="margin:0;padding:16px 20px;border-radius:10px;background:#eef1f7;font-size:30px;
                                  font-weight:700;letter-spacing:.28em;color:#1b3a6b;">
                            {{ .Token }}
                        </p>
                        <p style="margin:26px 0 0;font-size:13px;line-height:1.6;color:#6b7280;">
                            El código caduca en 10 minutos. Si no has solicitado este acceso, puedes ignorar el mensaje.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
