<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Código de acceso a NarteaGN</title>
</head>
<body bgcolor="#f6f2ea"
      style="margin:0;padding:0;background-color:#f6f2ea;color:#172b4d;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;">
<table bgcolor="#f6f2ea" cellpadding="0" cellspacing="0" role="presentation"
       style="width:100%;background-color:#f6f2ea;border-collapse:collapse;" width="100%">
    <tr>
        <td align="center" style="padding:40px 16px;" valign="top">
            <table bgcolor="#fffdf9" cellpadding="0" cellspacing="0" role="presentation"
                   style="width:100%;max-width:520px;background-color:#fffdf9;border:1px solid #d8c797;border-radius:14px;border-collapse:separate;"
                   width="520">
                <tr>
                    <td align="center" style="padding:38px 28px 36px;">
                        <p style="margin:0 0 12px;font-size:13px;line-height:1.4;letter-spacing:.16em;color:#667085;"
                           translate="no">
                            NarteaGN
                        </p>
                        <h1 style="margin:0 0 18px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.25;font-weight:400;color:#1b3a6b;">
                            Tu código de acceso
                        </h1>
                        <p style="margin:0 auto 26px;max-width:390px;font-size:15px;line-height:1.6;color:#44516a;">
                            Introduce este código en la pantalla de administración de tu invitación.
                        </p>
                        <table cellpadding="0" cellspacing="0" role="presentation"
                               style="width:100%;margin:0 auto;border-collapse:separate;" width="100%">
                            <tr>
                                <td align="center" bgcolor="#eef2f7"
                                    style="padding:18px 12px;background-color:#eef2f7;border:1px solid #d9e0ea;border-radius:10px;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;font-size:30px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:7px;white-space:nowrap;color:#1b3a6b;"
                                    translate="no">
                                    {{ .Token }}
                                </td>
                            </tr>
                        </table>
                        <p style="margin:26px auto 0;max-width:400px;font-size:13px;line-height:1.6;color:#667085;">
                            El código caduca en 5&nbsp;minutos. Si no has solicitado este acceso, puedes ignorar este
                            mensaje.
                        </p>
                    </td>
                </tr>
            </table>
            <p style="margin:18px 0 0;font-size:12px;line-height:1.5;color:#667085;">
                Acceso seguro proporcionado por <span translate="no">NarteaGN</span>
            </p>
        </td>
    </tr>
</table>
</body>
</html>
