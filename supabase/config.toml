# Local identifier only. The production project reference is supplied by
# SUPABASE_PROJECT_ID in GitHub Actions and is never committed here.
project_id = "template-wedding"

# Named explicitly rather than left to the default: `supabase/seed.sql` is what makes a freshly
# reset stack usable, and a silent default is easy to lose in a config migration.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 300

[local_smtp]
sender_name = "NarteaGN"

[auth.email.template.magic_link]
subject = "Tu código de acceso a NarteaGN"
content_path = "./supabase/templates/magic_link.html"
