name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read

# Queued, not cancelled. This job writes to production between steps -- `db push`, then the
# wedding date, then the Edge Function, then the published frontend -- so cancelling a run
# mid-sequence leaves the database migrated with none of the steps that follow it applied, and
# nothing reports it. Two pushes in a row to `main` are enough to trigger that.
concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gates the only job that mutates production behind GitHub's environment protection, so the
    # migrations that reach the real project do so with a human having looked at the run.
    environment: production
    timeout-minutes: 20
    outputs:
      page_url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint project
        run: pnpm run lint

      - name: Verify database migrations
        # Applies every migration to a throwaway Postgres and asserts the resulting schema and
        # trigger behaviour, so a broken migration fails here and never reaches `db push`.
        run: pnpm run db:verify

      - name: Fail if schema.sql drifted from the migrations
        run: git diff --exit-code -- supabase/schema.sql

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        # Never ran in CI before, so they drifted out of sync with the code they guard.
        run: pnpm run test:e2e

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm run build

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Apply pending database migrations
        # `--include-all` because `20260000_enable_extension.sql` is versioned before the first
        # migration the production project ever recorded (`20260712`, see ADR-012 §Sprint 7.1).
        # Without it `db push` reconciles local against remote, finds a local file ordered before
        # the remote head, and exits with "Found local migration files to be inserted before the
        # last migration on remote database" -- applying nothing and failing every step after it,
        # which is how the invitations row went missing and the RSVP started reporting 23503.
        #
        # This flag is not enough on its own for a project whose migrations were applied by hand:
        # repair the history first, or `db push` will try to re-apply them. See
        # docs/01-architecture/DATABASE_MIGRATIONS.md.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          # Prints the plan before applying it. `db push` reports what it did but not what it was
          # about to do, so a run that applies several accumulated migrations at once leaves no
          # record of the gap it closed. Kept in the same step as the push so it cannot run
          # against an unlinked project.
          echo "::group::Pending migrations"
          supabase migration list --linked
          echo "::endgroup::"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Sync wedding date for the purge cutoff
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Flip this repository variable to "true" after the first successful deploy. Until
          # then a slug already taken by another wedding fails the deploy in red (review §12.4).
          NARTEA_WEDDING_REGISTERED: ${{ vars.NARTEA_WEDDING_REGISTERED }}
        run: pnpm exec tsx scripts/sync-invitation.ts

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy send-purge-warnings --project-ref "$SUPABASE_PROJECT_ID"

      # Cloudflare only receives the built output. The gates above -- migrations, schema drift,
      # end-to-end tests -- stay in GitHub because Cloudflare's own build cannot run them.
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Smoke test deployed URL
        env:
          SMOKE_TEST_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm run smoke:test
