name: Quality Gates

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: quality-gate-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      # Against the built application, not the dev server: the plugin that emits the
      # Content-Security-Policy is `apply: 'build'`, so no other job ever loads a page carrying it.
      - name: Content-Security-Policy tests
        run: pnpm run test:e2e:csp

      - name: Cross-browser end-to-end tests
        # The matrix existed but nothing ran it, so `app.spec.ts` asserted a Safari preference in
        # `webkit` and `mobile-webkit` for as long as it took somebody to run it by hand.
        run: pnpm exec playwright install --with-deps firefox webkit && pnpm run test:e2e:matrix:compat

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  database:
    name: Database quality
    runs-on: ubuntu-latest
    # Raised from 15: this job now also pulls the Postgres image the verification harness runs.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `db:verify` shells out to docker compose, so pnpm is needed to resolve the script; there
      # is no dependency tree to install for it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # These two gates used to live only in `deploy.yml`, which runs on push to `main`. A broken
      # migration or a stale `supabase/schema.sql` therefore passed review in green and failed
      # only after merging -- with no pull request left to fix it and the production deploy
      # blocked. They run first here because they are cheaper than starting the whole stack.
      - name: Verify database migrations
        run: pnpm run db:verify

      # `db:verify` regenerates supabase/schema.sql from the migrations it applied. A diff means
      # somebody edited a migration without regenerating the snapshot.
      - name: Fail if schema.sql drifted from the migrations
        run: git diff --exit-code -- supabase/schema.sql

      # The CLI is the `supabase` devDependency, so the tree has to be on disk for `pnpm exec`
      # to resolve it. Installed here and not above: the two gates need none of it, and they are
      # the cheap ones.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm exec` and not `supabase/setup-cli`: the action installs the release it is pinned
      # to, which had drifted from the `supabase` version package.json pins, so CI and the
      # repository ran different CLIs. package.json is the single source of truth now.
      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Lint database
        run: pnpm exec supabase db lint --level warning

      - name: Test migrations and RLS
        run: pnpm exec supabase test db

      - name: Stop local Supabase
        if: ${{ always() }}
        run: pnpm exec supabase stop --no-backup

  edge-functions:
    name: Edge Function quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The bundler never sees these files: `tsc -b` excludes them and Vite does not build them,
      # so before this step ESLint was the only tool that read the only Deno artifact in
      # production. A type error here reached the nightly cron, not the pipeline.
      - name: Type-check Edge Functions
        run: find supabase/functions -name '*.ts' -exec deno check {} +
