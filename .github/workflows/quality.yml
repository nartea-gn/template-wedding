name: Quality Gates

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: quality-gate-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      # Against the built application, not the dev server: the plugin that emits the
      # Content-Security-Policy is `apply: 'build'`, so no other job ever loads a page carrying it.
      - name: Content-Security-Policy tests
        run: pnpm run test:e2e:csp

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  database:
    name: Database quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start local Supabase
        run: supabase start

      - name: Lint database
        run: supabase db lint --level warning

      - name: Test migrations and RLS
        run: supabase test db

      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup

  edge-functions:
    name: Edge Function quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The bundler never sees these files: `tsc -b` excludes them and Vite does not build them,
      # so before this step ESLint was the only tool that read the only Deno artifact in
      # production. A type error here reached the nightly cron, not the pipeline.
      - name: Type-check Edge Functions
        run: find supabase/functions -name '*.ts' -exec deno check {} +
